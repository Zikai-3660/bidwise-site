<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BidWise — Know Your Number Before You Bid</title>
  <meta name="description" content="Real-time TCG auction assistant for Whatnot, eBay Live & TikTok Live." />
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div class="max-w-4xl mx-auto p-6 space-y-8">
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold">Bid<span class="text-emerald-400">Wise</span></h1>
      <span class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-300">Chrome Side-Panel Extension</span>
    </header>

    <section class="space-y-4">
      <h2 class="text-4xl font-extrabold">Know your number <span class="text-emerald-400">before you bid.</span></h2>
      <p class="text-slate-300">Real-time TCG auction assistant for Whatnot, eBay Live & TikTok Live. Join the early access beta below.</p>

      <form id="signup-form" class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 max-w-xl">
        <input type="email" id="email" name="email" required placeholder="Enter your email address..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100" />
        <select id="primary-tcg" name="primary_tcg" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-slate-200">
          <option value="Pokemon (EN / JP)">Pokémon (EN / JP)</option>
          <option value="Magic: The Gathering">Magic: The Gathering</option>
          <option value="One Piece Card Game">One Piece Card Game</option>
        </select>
        <button type="submit" id="submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition">
          Join the Early Access Beta →
        </button>
      </form>
      <div id="form-success" class="hidden text-emerald-400 font-semibold">You're on the beta list!</div>
      <p id="form-error" class="hidden text-rose-400 text-xs">Something went wrong submitting your email. Please try again.</p>
    </section>
  </div>

  <script>
    const WEB3FORMS_ACCESS_KEY = "969008ef-4766-4070-99bc-bd34969ecc47";

    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('form-error');
      const email = document.getElementById('email').value;
      const tcg = document.getElementById('primary-tcg').value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Reserving your spot...";
      errorEl.classList.add('hidden');

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            access_key: WEB3FORMS_ACCESS_KEY,
            subject: "New BidWise Beta Waitlist Signup (" + tcg + ")",
            from_name: "BidWise Waitlist",
            email: email,
            primary_tcg: tcg
          })
        });

        const result = await response.json();
        if (result.success) {
          document.getElementById('signup-form').classList.add('hidden');
          document.getElementById('form-success').classList.remove('hidden');
        } else {
          throw new Error(result.message || "Submission failed");
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Join the Early Access Beta →";
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
